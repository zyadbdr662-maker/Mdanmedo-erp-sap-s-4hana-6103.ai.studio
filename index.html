<!doctype html>

    <meta charset="UTF-8" />
    <script>
      // Gracefully handle benign Vite HMR websocket disconnection in AI Studio iframe environment
      (function() {
        var isViteHmr = function(msg) {
          if (!msg) return false;
          var s = String(msg);
          return s.indexOf('[vite]') !== -1 || s.indexOf('failed to connect to websocket') !== -1 || s.indexOf('WebSocket connection') !== -1;
        };
        window.addEventListener('error', function(e) {
          if (isViteHmr(e.message) || (e.error && isViteHmr(e.error.message)) || (e.filename && e.filename.indexOf('@vite/client') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteHmr(e.reason) || (e.reason && isViteHmr(e.reason.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        var _origErr = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteHmr(arguments[i]) || (arguments[i] && typeof arguments[i] === 'object' && isViteHmr(arguments[i].message))) {
              return;
            }
          }
          _origErr.apply(console, arguments);
        };
      })();
    </script>
